[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-migration-auditor"
version = "0.2.0"
description = "A local FastAPI auditor for deterministic CRM migration export verification."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.4,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx2>=2.13.1,<3", "ruff>=0.11,<1"]
worker = ["celery[redis]>=5.5,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv*", ".scaffold-backup"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]
