name: Application checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=app --cov-report=term-missing

  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDITOR_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Build and start packaged services
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Exercise frontend and proxied API readiness
        run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/designs.html
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/openapi.json
      - name: Run synthetic audit through nginx and Celery
        run: python scripts/demo.py --base-url http://127.0.0.1:8080 --export-dir .data/container-smoke
      - name: Assert downloaded packaged verdict and findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path(".data/container-smoke").glob("audit-report-*.json"))
          assert len(reports) == 1, reports
          report = json.loads(reports[0].read_text())
          assert report["verdict"] == "failed", report
          assert report["finding_counts"] == {
              "field_mismatch": 1,
              "missing_record": 1,
              "unexpected_record": 1,
          }, report
          PY
      - name: Collect packaged service logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove packaged services and temporary volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: auditor
          POSTGRES_DB: auditor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditor -d auditor"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDITOR_DATABASE_URL: postgresql+psycopg://auditor:auditor@localhost:5432/auditor
      AUDITOR_AUTO_CREATE_SCHEMA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[postgres]"
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
