server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend CSV files default to 5 MiB; allow multipart framing too.
    client_max_body_size 6m;

    # Resolve the Compose service at request time, including after API recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:8000;

    location ~ ^/(api/|health/|docs(?:/|$)|openapi\.json$) {
        # Keep the original path and query string. Auth headers pass through;
        # this proxy deliberately does not inject an API key.
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
